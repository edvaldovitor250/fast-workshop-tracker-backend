services:
  mysql:
    image: 'mysql:8.0'
    environment:
      - 'MYSQL_DATABASE=workshop_tracker'
      - 'MYSQL_PASSWORD=workshop'
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'MYSQL_USER=workshop'
    ports:
      - '3306:3306'
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
