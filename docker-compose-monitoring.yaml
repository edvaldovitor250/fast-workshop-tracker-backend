version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: workshop-tracker-mysql
    environment:
      MYSQL_DATABASE: workshop_tracker
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: workshop
      MYSQL_PASSWORD: workshop
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: workshop-tracker-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - mysql

  grafana:
    image: grafana/grafana:latest
    container_name: workshop-tracker-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/workshop-tracker-dashboard.json
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: workshop-tracker-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
